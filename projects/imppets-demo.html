<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ImpPets app demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ===== Demo layout: notes on the left, phone on the right ===== */
    body { background: var(--bg); }
    .demo { display: flex; flex-wrap: wrap-reverse; gap: 40px clamp(32px, 6vw, 96px); align-items: flex-start; padding-block: 8px 24px; }
    .notes { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 24px; }
    .notes .screen-name { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #6E68C9; }
    .notes h2 { margin: 0; font-weight: 300; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.05; letter-spacing: -.02em; }
    .notes .say { margin: 0; font-style: italic; font-size: 19px; line-height: 1.5; color: #3B3F52; max-width: 40ch; }
    .notes .try { margin: 0; display: flex; gap: 10px; align-items: baseline; font-size: 16px; }
    .notes .try b { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 500; white-space: nowrap; }
    .device-card { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; align-items: center; border-top: 1px solid var(--ink); padding-top: 18px; }
    .device-card img { width: 112px; height: auto; transition: transform .5s var(--ease); }
    .device-card img.bump { transform: scale(1.08) rotate(-4deg); }
    .device-card .mono { font-size: 11px; }
    .device-card strong { display: block; font-weight: 400; font-size: 22px; margin: 4px 0 8px; }
    .meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .meter span { display: block; height: 100%; background: #8C87D6; border-radius: 99px; transition: width .6s var(--ease); }
    .flowlist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .flowlist li { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
    .flowlist li.done { border-color: #8C87D6; color: #4E48A8; background: #ECEAFB; }
    .reset { align-self: flex-start; }

    .phone-wrap { flex: 0 1 390px; min-width: 0; width: 100%; max-width: 390px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .phone-fit { position: relative; width: 100%; min-width: 0; height: calc(812px * var(--s, 1)); }
    .phone { position: absolute; left: 50%; top: 0; width: 390px; height: 812px; transform: translateX(-50%) scale(var(--s, 1)); transform-origin: top center; background: #16161B; border-radius: 54px; padding: 12px; box-shadow: 0 40px 80px -30px rgba(40, 30, 90, .45); position: relative; }
    .phone::before { content: ""; position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 108px; height: 30px; background: #16161B; border-radius: 20px; z-index: 5; }
    .phone-hint { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    /* ===== The app (its own design language: ImpPets brand) ===== */
    .app {
      --a-bg: #F5F3FC; --a-card: #FFFFFF; --a-navy: #1A2855; --a-lilac: #A2A0DB; --a-soft: #ECEAFB; --a-text: #1E2235; --a-muted: #6F7489; --a-yolk: #F5BC44; --a-line: #E6E3F3;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--a-text); background: var(--a-bg);
      width: 100%; height: 100%; border-radius: 42px; overflow: hidden; position: relative; display: flex; flex-direction: column; font-size: 14px; line-height: 1.35;
    }
    .app button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    .app :focus-visible { outline: 2px solid var(--a-navy); outline-offset: 2px; }
    .status { display: flex; justify-content: space-between; padding: 16px 28px 6px; font-size: 14px; font-weight: 600; flex: none; }
    .status span:last-child { letter-spacing: 2px; font-size: 11px; }
    .scr { flex: 1; overflow-y: auto; padding: 8px 18px 24px; scrollbar-width: none; }
    .scr::-webkit-scrollbar { display: none; }
    .tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 10px 22px; background: rgba(255,255,255,.92); border-top: 1px solid var(--a-line); }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--a-muted); padding: 4px 0; }
    .tab .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
    .tab[aria-current="page"] { color: var(--a-navy); font-weight: 600; }
    .tab[aria-current="page"] .ic { background: var(--a-navy); color: #fff; }
    .ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .h-sub { color: var(--a-muted); font-size: 13px; margin: 4px 0 0; }
    .h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 0; }
    .sec { font-size: 16px; font-weight: 700; margin: 22px 0 10px; }
    .card { background: var(--a-card); border-radius: 22px; padding: 14px; box-shadow: 0 6px 20px -12px rgba(40, 30, 90, .25); }
    .row-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
    .row-item + .row-item { border-top: 1px solid var(--a-line); }
    .ri-ic { width: 34px; height: 34px; border-radius: 12px; background: var(--a-soft); color: var(--a-navy); display: grid; place-items: center; flex: none; }
    .ri-ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ri-t { font-weight: 600; font-size: 13.5px; }
    .ri-s { color: var(--a-muted); font-size: 12px; }
    .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }

    .pet-card { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; }
    .pet-card img { width: 112px; height: 112px; object-fit: cover; border-radius: 24px; background: var(--a-soft); }
    .k { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--a-muted); font-weight: 600; }
    .pet-name { font-size: 22px; font-weight: 700; margin: 2px 0; }
    .bar { height: 7px; border-radius: 9px; background: var(--a-soft); overflow: hidden; margin-top: 8px; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--a-lilac), var(--a-navy)); border-radius: 9px; transition: width .6s cubic-bezier(.16,1,.3,1); }
    .grew { margin-top: 12px; font-size: 12px; color: var(--a-muted); display: flex; gap: 6px; align-items: center; }

    .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--a-card); border-radius: 999px; padding: 4px; margin-top: 14px; }
    .seg button { padding: 9px 0; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--a-muted); }
    .seg button[aria-pressed="true"] { background: var(--a-navy); color: #fff; }
    .search { margin-top: 12px; display: flex; gap: 8px; align-items: center; background: var(--a-card); border-radius: 999px; padding: 10px 14px; color: var(--a-muted); font-size: 13px; }
    .search svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
    .chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
    .chip { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--a-card); font-size: 12.5px; font-weight: 600; color: var(--a-text); }
    .chip[aria-pressed="true"] { background: var(--a-navy); color: #fff; }
    .act { display: block; width: 100%; text-align: left; margin-top: 14px; padding: 0; overflow: hidden; }
    .act .ph { height: 132px; background-size: cover; background-position: center; position: relative; }
    .act .tags { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
    .act .tags span, .tagpill { background: rgba(255,255,255,.9); color: var(--a-navy); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
    .act .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
    .act .org { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--a-muted); font-weight: 600; }
    .act .tt { font-size: 16px; font-weight: 700; }
    .meta-line { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--a-muted); }
    .meta-line svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
    .going { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--a-muted); }
    .stack { display: flex; }
    .stack .av { width: 24px; height: 24px; font-size: 9px; border: 2px solid #fff; margin-left: -6px; }
    .stack .av:first-child { margin-left: 0; }
    .booked-badge { margin-left: auto; font-size: 11px; font-weight: 700; color: #2F7D4F; background: #E3F4EA; padding: 3px 8px; border-radius: 999px; }

    .post { margin-top: 12px; }
    .post p { margin: 8px 0 10px; font-size: 14px; }

    .back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--a-navy); padding: 4px 0; }
    .hero-ph { height: 170px; border-radius: 22px; background-size: cover; background-position: center; margin-top: 8px; position: relative; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn-a { padding: 12px 0; border-radius: 999px; font-weight: 700; font-size: 13.5px; text-align: center; }
    .btn-a.primary { background: var(--a-navy); color: #fff; }
    .btn-a.ghost { background: var(--a-card); color: var(--a-navy); box-shadow: inset 0 0 0 1.5px var(--a-navy); }
    .btn-a.on { background: var(--a-soft); color: var(--a-navy); box-shadow: none; }
    .small-btn { padding: 7px 14px; border-radius: 999px; background: var(--a-navy); color: #fff; font-size: 12px; font-weight: 700; flex: none; }
    .small-btn.sent { background: var(--a-soft); color: var(--a-navy); }
    .link-btn { font-size: 12px; font-weight: 700; color: #4E48A8; text-decoration: underline; padding: 0; }

    .months { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
    .months span { padding: 6px 12px; border-radius: 999px; background: var(--a-card); font-size: 12px; font-weight: 600; }
    .months span.on { background: var(--a-navy); color: #fff; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; text-align: center; }
    .day { padding: 8px 0; border-radius: 16px; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--a-muted); }
    .day b { font-size: 16px; color: var(--a-text); }
    .day.on { background: var(--a-navy); color: #cfd2ef; }
    .day.on b { color: #fff; }
    .day i { width: 5px; height: 5px; border-radius: 50%; background: var(--a-lilac); margin: 2px auto 0; font-style: normal; }
    .day.on i { background: #fff; }
    .tl { position: relative; padding-left: 18px; }
    .tl::before { content: ""; position: absolute; left: 5px; top: 18px; bottom: 18px; width: 1.5px; background: var(--a-line); }
    .tl .card { margin-top: 10px; position: relative; }
    .tl .card::before { content: ""; position: absolute; left: -18px; top: 18px; width: 11px; height: 11px; border-radius: 50%; background: var(--a-yolk); border: 2px solid var(--a-bg); }
    .time { font-size: 12px; color: var(--a-muted); display: flex; gap: 6px; align-items: center; }
    .time svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
    .empty { color: var(--a-muted); font-size: 13px; padding: 14px; text-align: center; }

    .nfc-card { background: var(--a-navy); color: #fff; border-radius: 24px; padding: 18px; margin-top: 14px; }
    .nfc-card .k { color: #B9BCE6; }
    .nfc-card h3 { margin: 4px 0; font-size: 18px; }
    .nfc-card p { margin: 0; font-size: 12.5px; color: #CFD2EF; }
    .nfc-card .show { margin-top: 14px; width: 100%; background: #fff; color: var(--a-navy); border-radius: 999px; padding: 12px 0; font-weight: 700; }
    .chat-item { display: flex; gap: 12px; align-items: center; padding: 11px 0; width: 100%; text-align: left; }
    .chat-item + .chat-item { border-top: 1px solid var(--a-line); }
    .chat-item .mid { flex: 1; min-width: 0; }
    .chat-item .last { color: var(--a-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { min-width: 18px; height: 18px; border-radius: 9px; background: #D9443B; color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }

    .overlay { position: absolute; inset: 0; background: rgba(26, 40, 85, .55); backdrop-filter: blur(6px); display: flex; align-items: flex-end; z-index: 10; border-radius: 42px; }
    .sheet { background: var(--a-bg); width: 100%; border-radius: 30px 30px 42px 42px; padding: 18px 18px 26px; max-height: 92%; overflow-y: auto; }
    .tapping { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 0 8px; text-align: center; }
    .rings { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
    .rings i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--a-lilac); animation: ring 1.6s ease-out infinite; }
    .rings i:nth-child(2) { animation-delay: .5s; }
    .rings img { width: 72px; position: relative; }
    @keyframes ring { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
    .profile { background: var(--a-navy); color: #fff; border-radius: 26px; padding: 18px; }
    .profile .top { display: flex; gap: 14px; align-items: center; }
    .profile .mc { width: 64px; height: 64px; border-radius: 20px; background: #8C87D6; display: grid; place-items: center; font-size: 22px; font-weight: 700; }
    .profile .nm { font-size: 20px; font-weight: 700; }
    .profile .nm small { font-size: 11px; font-weight: 500; color: #CFD2EF; margin-left: 4px; }
    .profile .hd { font-size: 12px; color: #CFD2EF; }
    .facts3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .facts3 div { background: rgba(255,255,255,.1); border-radius: 14px; padding: 8px; font-size: 12px; font-weight: 600; }
    .facts3 span { display: block; font-size: 9.5px; letter-spacing: .08em; color: #B9BCE6; font-weight: 600; }
    .profile .bio { margin: 12px 0 0; font-size: 13px; line-height: 1.45; }
    .interests { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

    .chat-head { display: flex; gap: 10px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--a-line); }
    .msgs { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; }
    .msg { max-width: 78%; padding: 9px 13px; border-radius: 18px; font-size: 13.5px; }
    .msg.them { background: var(--a-card); align-self: flex-start; border-bottom-left-radius: 6px; }
    .msg.me { background: var(--a-navy); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
    .compose { display: flex; gap: 8px; align-items: center; background: var(--a-card); border-radius: 999px; padding: 6px 6px 6px 14px; }
    .compose input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 13.5px; color: var(--a-text); outline: none; }
    .compose button { width: 34px; height: 34px; border-radius: 50%; background: var(--a-navy); color: #fff; display: grid; place-items: center; }

    .toast { position: absolute; left: 16px; right: 16px; bottom: 96px; background: var(--a-navy); color: #fff; padding: 12px 14px; border-radius: 16px; font-size: 13px; z-index: 20; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); opacity: 0; transform: translateY(10px); transition: opacity .3s, transform .3s; pointer-events: none; }
    .toast.on { opacity: 1; transform: none; }
    .toast b { color: var(--a-yolk); }
      html { touch-action: manipulation; }
    /* stop mobile browsers from auto-inflating text inside this embedded frame */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body * { max-height: 1000000px; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="demo">
    <!-- ===== 左边：解说（文字来自报告总页面） ===== -->
    <aside class="notes" aria-live="polite">
      <span class="screen-name" id="n-name">Home</span>
      <h2 id="n-title">Your pet grows as you settle in.</h2>
      <p class="say" id="n-say"></p>
      <p class="try"><b>Try this</b><span id="n-try"></span></p>
      <div class="device-card">
        <img id="dev-img" src="../assets/img/imppets-cut-egg.webp" alt="Your ImpPet device">
        <div>
          <span class="mono muted">Your ImpPet device · <span id="sp">3</span> social points</span>
          <strong id="dev-stage">A mystery egg</strong>
          <div class="meter" aria-hidden="true"><span id="dev-meter" style="width:30%"></span></div>
        </div>
      </div>
      <ul class="flowlist" aria-label="Flow you have tried">
        <li data-flow="explore">Explore</li>
        <li data-flow="book">Book</li>
        <li data-flow="invite">Go together · invite</li>
        <li data-flow="chat">Start chat</li>
        <li data-flow="calendar">Calendar</li>
        <li data-flow="nfc">Tap NFC</li>
      </ul>
      <button class="btn reset" type="button" id="reset">↺ Start over</button>
    </aside>

    <!-- ===== 右边：手机 ===== -->
    <div class="phone-wrap">
      <div class="phone-fit" id="phone-fit"><div class="phone">
        <div class="app" id="app">
          <div class="status" aria-hidden="true"><span>9:41</span><span>●●● ▮</span></div>
          <div class="scr" id="scr"></div>
          <nav class="tabs" id="tabs" aria-label="App tabs"></nav>
          <div class="toast" id="toast" role="status"></div>
        </div>
      </div></div>
      <span class="phone-hint">Tap around · everything is clickable</span>
    </div>
  </div>
</div>

<script>
(function () {
  var IMG = '../assets/img/';
  var I = {
    home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
    explore: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
    friends: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .6 3.3 2.4 3.5 5.5"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    people: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/></svg>',
    flag: '<svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    send: '<svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z"/></svg>',
    nfc: '<svg viewBox="0 0 24 24"><path d="M6 8a8 8 0 0 1 0 8M9.5 6a12 12 0 0 1 0 12M13 4a16 16 0 0 1 0 16"/></svg>'
  };
  var COL = { AC: '#E39A7A', JP: '#7FB59A', SR: '#E7A9C0', KT: '#8C9AD6', PN: '#C9A15A', DF: '#8C87D6', MC: '#8C87D6' };
  function av(ini) { return '<span class="av" style="background:' + (COL[ini] || '#8C87D6') + '">' + ini + '</span>'; }

  /* ---------- 数据（示例） ---------- */
  var ACTS = [
    { id: 'coffee', title: 'Specialty Coffee Tasting', org: 'Imperial Coffee Society', place: 'South Ken · Notes Coffee', time: 'Tue 4 Nov · 4:30 PM', day: 4, at: '4:30 PM', cat: 'Social', tags: ['Cozy', 'Foodie'], going: 12, interested: 34, img: IMG + 'imppets-event-coffee.webp',

  function vCalendar() {

      '<div class="interests">' + ['Film photography', 'Hiking', 'Indie music'].map(function (t) { return '<span class="tagpill" style="background:var(--a-soft)">' + t + '</span>'; }).join('') + '</div>' +

  render();
  function report() { try { parent.postMessage({ imppetsDemoHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*'); } catch (e) {} }
  report(); window.addEventListener('resize', report); new MutationObserver(report).observe(document.body, { subtree: true, childList: true });
})();

<script>
/* Fit the embedding frame to this page and adapt wording for touch screens */
(function () {
  var KEY = 'imppetsDemoHeight', last = 0;
  function h() {
    var b = document.body, cs = getComputedStyle(b);
    return Math.ceil(b.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom));
  }
  function send() { var v = h(); if (Math.abs(v - last) > 1) { last = v; var m = {}; m[KEY] = v; try { parent.postMessage(m, '*'); } catch (e) {} } }
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
  window.addEventListener('load', send); window.addEventListener('resize', send);
  setTimeout(send, 300); setTimeout(send, 1500); send();
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) {
    document.documentElement.classList.add('touch');
    var swap = function (el) { if (!el) return; var t = el.textContent, n = t.replace(/Double-click/g, 'Double-tap').replace(/double-click/g, 'double-tap').replace(/ or your arrow keys/g, ''); if (n !== t) el.textContent = n; };
    document.querySelectorAll('.hint').forEach(function (el) { swap(el); new MutationObserver(function () { swap(el); }).observe(el, { childList: true, characterData: true, subtree: true }); });
  }
})();
</script>
<script>
/* Keep the phone mock-up at true phone proportions and shrink it to fit small screens */
(function () {
  var fit = document.getElementById('phone-fit');
  function scale() {
    var w = fit.clientWidth, k = window.innerWidth < 560 ? 0.8 : 1;
    fit.style.setProperty('--s', Math.min(1, (w * k) / 390).toFixed(4));
  }
  scale(); window.addEventListener('resize', scale);
  if (window.ResizeObserver) new ResizeObserver(scale).observe(fit);
})();
</script>
</body>
</html>
