<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>airevo product explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    /* airevo brand tokens */
    :root {
      --cream: #F7F1EC; --blush: #EED6D1; --rose: #B9787A; --rose-deep: #8E4F55; --ink: #2B211F; --muted: #6E605C; --line: #E3D2CC; --white: #FFFFFF;
      --serif: 'Cormorant Garamond', Georgia, serif; --script: 'Pinyon Script', 'Snell Roundhand', cursive; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--serif); font-size: 18px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--rose-deep); outline-offset: 3px; }

    .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 4px 0 16px; }
    .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 999px; padding: 3px; }
    .seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; min-height: 36px; }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
    .seg.height { border-color: var(--rose-deep); }
    .seg.height button[aria-pressed="true"] { background: var(--rose-deep); }
    .seg.height[hidden] { display: none; }
    .hint { flex: 1 1 260px; margin: 0; font-style: italic; color: var(--muted); font-size: 17px; text-align: right; }

    .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; background: linear-gradient(180deg, #FBF6F2, #F3E5E0); border-radius: 4px; overflow: hidden; }
    @media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } .hint { text-align: left; } }

    /* ---------- stage ---------- */
    .stage { position: relative; height: 680px; perspective: 1400px; overflow: hidden; }
    @media (max-width: 820px) { .stage { height: 560px; } }
    .halo { position: absolute; left: 50%; top: 48%; width: 76%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, #F1D5D0, rgba(241,213,208,0)); pointer-events: none; }
    .script-bg { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-family: var(--script); font-size: clamp(34px, 5vw, 60px); color: rgba(142,79,85,.16); pointer-events: none; white-space: nowrap; }

    .hero { position: absolute; left: 50%; top: 47%; width: min(78%, 560px); transform: translate(-50%, -50%); transition: opacity .5s, transform .6s var(--ease); cursor: pointer; z-index: 3; }
    .hero .tilt { position: relative; animation: float 4.5s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-16px) rotate(1deg); } }
    @media (prefers-reduced-motion: reduce) { .hero .tilt { animation: none; } }
    .hero img { width: 100%; height: auto; display: block; filter: drop-shadow(0 40px 34px rgba(110,60,60,.22)); user-select: none; -webkit-user-drag: none; }
    .exploded .hero { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.92); }

    .layer { position: absolute; left: 50%; transform: translate(-50%, 0) scale(.9); opacity: 0; transition: transform .9s var(--ease), opacity .6s, top .9s var(--ease); pointer-events: none; z-index: 2; }
    .layer img { width: 100%; height: auto; display: block; filter: drop-shadow(0 18px 18px rgba(110,60,60,.16)); user-select: none; -webkit-user-drag: none; }
    .exploded .layer { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
    .exploded .layer:nth-child(1) { transition-delay: .05s; } .exploded .layer:nth-child(2) { transition-delay: .12s; } .exploded .layer:nth-child(3) { transition-delay: .19s; } .exploded .layer:nth-child(4) { transition-delay: .26s; }
    .l-up { width: 40%; top: 1%; } .l-ins { width: 44%; top: 47%; } .l-inn { width: 47%; top: 59%; } .l-out { width: 47%; top: 71%; }
    @media (max-width: 820px) { .stage { height: 700px; } .l-up { width: 64%; top: 6%; } .l-ins { width: 68%; top: 47%; } .l-inn { width: 72%; top: 58%; } .l-out { width: 72%; top: 69%; } .lift { top: auto; bottom: 14px; } }
    .exploded .script-bg { opacity: 0; }
    .script-bg { transition: opacity .4s; }
    .flat .layer.l-out { opacity: .12; transform: translate(-50%, 70px) scale(.96); }
    .pin { position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--white); color: var(--rose-deep); font-family: var(--mono); font-size: 12px; font-weight: 500; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--rose-deep), 0 6px 14px rgba(110,60,60,.25); display: grid; place-items: center; transition: transform .25s var(--ease), background .2s, color .2s; }
    .pin:hover, .pin[aria-pressed="true"] { background: var(--rose-deep); color: var(--white); transform: translate(-50%, -50%) scale(1.15); }
    .pin::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid var(--rose); animation: pulse 2s ease-out infinite; }
    .pin[aria-pressed="true"]::after { animation: none; border-color: transparent; }
    @keyframes pulse { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

    .mode-tag { position: absolute; left: 20px; top: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--rose-deep); z-index: 4; }
    .lift { position: absolute; right: 20px; top: 44px; z-index: 4; text-align: right; opacity: 0; transition: opacity .4s; }
    .exploded .lift { opacity: 1; }
    .lift b { display: block; font-weight: 500; font-size: 40px; line-height: 1; color: var(--rose-deep); }
    .lift span { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    /* ---------- materials panel ---------- */
    .panel { padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 18px; border-left: 1px solid var(--line); background: rgba(255,255,255,.45); }
    @media (max-width: 820px) { .panel { border-left: 0; border-top: 1px solid var(--line); } }
    .panel .k { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--rose-deep); }
    .parts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
    .parts button { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 0; min-height: 44px; }
    .parts .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .parts .nm { font-size: 20px; font-weight: 500; transition: transform .35s var(--ease); }
    .parts .mt { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .parts button[aria-pressed="true"] .nm { color: var(--rose-deep); transform: translateX(6px); }
    .parts button[aria-pressed="true"] .n { color: var(--rose-deep); }
    .card { background: var(--white); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-height: 220px; box-shadow: 0 10px 30px -18px rgba(110,60,60,.35); }
    .card h3 { margin: 0; font-weight: 500; font-size: 28px; line-height: 1.1; }
    .card .mat { font-family: var(--mono); font-size: 12px; color: var(--rose-deep); text-transform: uppercase; letter-spacing: .06em; }
    .card p { margin: 0; font-size: 17px; line-height: 1.45; }
    .card .why { color: var(--muted); font-style: italic; }
    .card .spec { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--ink); line-height: 1.5; }
    .card.swap { animation: swap .45s var(--ease); }
    @keyframes swap { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .intro { margin: 0; font-size: 17px; color: var(--muted); font-style: italic; }
    @media (prefers-reduced-motion: reduce) { .pin::after { animation: none; } * { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="v-product" aria-pressed="true">Product</button>
      <button type="button" id="v-explode" aria-pressed="false">Exploded · materials</button>
    </div>
    <div class="seg height" role="group" aria-label="Height mode" id="heights" hidden>
      <button type="button" id="h-boost" aria-pressed="true">Height-boost +5 cm</button>
      <button type="button" id="h-flat" aria-pressed="false">Flat mode</button>
    </div>
    <p class="hint" id="hint">Double-click the shoe to take it apart.</p>
  </div>

  <div class="wrap" id="wrap">
    <div class="stage" id="stage">
      <div class="halo" aria-hidden="true"></div>
      <span class="mode-tag" id="mode-tag">SwitchLift · height-boost mode</span>

      <div class="hero" id="hero" role="img" aria-label="airevo SwitchLift platform sneaker in cream patent leather and silk on a transparent air-cushion sole">
        <div class="tilt" id="tilt"><img src="../assets/img/airevo-hero.webp" alt="" draggable="false"></div>
      </div>

      <div id="layers"></div>

      <div class="lift" aria-live="polite"><b id="lift-b">+5 cm</b><span id="lift-s">Target ≤ 350 g per shoe · EU 38</span></div>
      <div class="script-bg" aria-hidden="true">Elevate your every step.</div>
    </div>

    <aside class="panel">
      <span class="k">What it’s made of</span>
      <p class="intro" id="intro">Seven parts, each chosen for comfort, stability or a refined finish. Open the exploded view, then pick a part.</p>
      <ol class="parts" id="parts"></ol>
      <div class="card" id="card" aria-live="polite"></div>
    </aside>
  </div>

<script>
(function () {
  var IMG = '../assets/img/';
  /* Part data: from the airevo portfolio (exploded view, morphological analysis, requirements, validation) */
  var PARTS = [
    { nm: 'Adjustable elastic cord', mat: 'Elastic cord · quick-pull toggle', layer: 0, at: [52, 15],
      what: 'A quick-pull lacing system that lets you fine-tune the fit in both flat and platform modes.',
      why: 'Chosen over bow laces, Velcro and BOA: quick micro-adjustment and a secure fit as the sole height changes, with no loose laces and a cleaner look.',
      spec: 'Fastening · tested against bow laces, elastic strap, wide Velcro, BOA' },
    { nm: 'Lambskin lining', mat: 'Lambskin', layer: 0, at: [57, 33],
      what: 'A soft, breathable contact layer that reduces friction and hot spots on long commutes and height-boost days.',
      why: 'After a full day, feet sweat and swell. The lining must be soft, skin-friendly and moisture-wicking to prevent blisters.',
      spec: 'Criterion · comfort & breathability' },
    { nm: 'Patent leather upper', mat: 'Patent leather', layer: 0, at: [17, 72],
      what: 'A glossy structural shell that gives the shoe its shape and side-to-side stability.',
      why: 'Patent leather adds structure, durability and water resistance, for a polished look that works from office to evening.',
      spec: 'Criterion · support & stability, refined aesthetics' },
    { nm: 'Silk upper', mat: 'Silk overlay', layer: 0, at: [62, 66],
      what: 'A delicate overlay with a soft touch and subtle sheen that gives the sneaker a dress-ready, feminine character.',
      why: 'Silk brings softness and a luxurious hand-feel to the accent panels, balancing the structure of the patent leather.',
      spec: 'Criterion · lightweight & refined aesthetics' },
    { nm: 'Zonal insole', mat: 'EVA / PU zones', layer: 1, at: [50, 45],
      what: 'Ergonomically contoured cushioning zones that redistribute pressure for a 50 kg wearer, protecting heel, arch and forefoot.',
      why: 'Plantar pressure mapping showed peaks under the heel and first metatarsal heads, so each zone gets its own material and hardness.',
      spec: 'Heel 20–30 Shore A · arch 45–55 Shore A core · forefoot pad 20–25 Shore A · toes with flex grooves' },
    { nm: 'Inner sole', mat: 'ETPU beads', layer: 2, at: [48, 50],
      what: 'A rigid plug-in interface that locks the upper to the platform base and keeps everything aligned in height-boost mode.',
      why: 'ETPU resists permanent compression better than EVA or PU foam, so the sole keeps its height, with strong cushioning and energy return.',
      spec: 'Tool-free lock · clear click when fully engaged' },
    { nm: 'Outer sole', mat: 'Transparent TPU air cushion', layer: 3, at: [52, 50],
      what: 'A transparent air-cushion platform that adds height while reducing weight and absorbing impact.',
      why: 'TPU is abrasion- and slip-resistant, flexible and lighter than solid rubber, and moulds well into air-cushion or honeycomb structures.',
      spec: '+5 cm visible lift · prototyped in TPU 95A by 3D printing' }
  ];
  var LAYERS = [
    { src: 'airevo-upper.webp', cls: 'l-up' },
    { src: 'airevo-insole.webp', cls: 'l-ins' },
    { src: 'airevo-innersole.webp', cls: 'l-inn' },
    { src: 'airevo-outsole.webp', cls: 'l-out' }
  ];

  var wrap = document.getElementById('wrap'), stage = document.getElementById('stage'), layersEl = document.getElementById('layers');
  var hero = document.getElementById('hero');
  var partsEl = document.getElementById('parts'), card = document.getElementById('card');
  var exploded = false, flat = false, sel = -1;

  // build layers + pins
  LAYERS.forEach(function (L, i) {
    var d = document.createElement('div');
    d.className = 'layer ' + L.cls;
    d.innerHTML = '<img src="' + IMG + L.src + '" alt="" draggable="false">';
    layersEl.appendChild(d);
    L.el = d;
  });
  PARTS.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pin'; b.textContent = i + 1; b.setAttribute('aria-label', p.nm); b.setAttribute('aria-pressed', 'false');
    b.style.left = p.at[0] + '%'; b.style.top = p.at[1] + '%';
    b.addEventListener('click', function (e) { e.stopPropagation(); pick(i); });
    LAYERS[p.layer].el.appendChild(b);
    var li = document.createElement('li');
    li.innerHTML = '<button type="button" aria-pressed="false"><span class="n">0' + (i + 1) + '</span><span class="nm">' + p.nm + '</span><span class="mt">' + p.mat.split(' · ')[0] + '</span></button>';
    li.querySelector('button').addEventListener('click', function () { if (!exploded) setExploded(true); pick(i); });
    partsEl.appendChild(li);
  });

  function pick(i) {
    sel = i;
    var p = PARTS[i];
    [].forEach.call(document.querySelectorAll('.pin'), function (b, k) { b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
    [].forEach.call(partsEl.querySelectorAll('button'), function (b, k) { b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
    card.innerHTML = '<span class="mat">0' + (i + 1) + ' · ' + p.mat + '</span><h3>' + p.nm + '</h3><p>' + p.what + '</p><p class="why">' + p.why + '</p><div class="spec">' + p.spec + '</div>';
    card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
  }
  function idleCard() {
    card.innerHTML = '<span class="mat">SwitchLift modular platform sneaker</span><h3>One shoe, two heights.</h3><p>A detachable platform midsole lets the shoe switch from a slim trainer to a 5 cm height-boost mode, using the same upper, fit and support.</p><p class="why">Seamlessly switch between everyday comfort and height-boost mode in about 10 seconds.</p><div class="spec">Designed for young urban women, 20–35</div>';
  }

  function setExploded(on) {
    exploded = on;
    wrap.classList.toggle('exploded', on);
    document.getElementById('v-product').setAttribute('aria-pressed', on ? 'false' : 'true');
    document.getElementById('v-explode').setAttribute('aria-pressed', on ? 'true' : 'false');
    document.getElementById('heights').hidden = !on;
    document.getElementById('hint').textContent = on ? 'Tap a numbered pin to see its material. Double-click to put it back together.' : 'Double-click the shoe to take it apart.';
    if (on && sel < 0) pick(0);
    if (!on) { setFlat(false); }
    updateTag();
  }
  function setFlat(on) {
    flat = on;
    wrap.classList.toggle('flat', on);
    document.getElementById('h-boost').setAttribute('aria-pressed', on ? 'false' : 'true');
    document.getElementById('h-flat').setAttribute('aria-pressed', on ? 'true' : 'false');
    document.getElementById('lift-b').textContent = on ? 'Flat' : '+5 cm';
    document.getElementById('lift-s').textContent = on ? 'Platform removed · target ≤ 280 g' : 'Target ≤ 350 g per shoe · EU 38';
    if (on) pick(6);
    updateTag();
  }
  function updateTag() {
    document.getElementById('mode-tag').textContent = 'SwitchLift · ' + (exploded ? (flat ? 'flat mode, exploded' : 'height-boost mode, exploded') : 'height-boost mode');
  }

  document.getElementById('v-product').addEventListener('click', function () { setExploded(false); });
  document.getElementById('v-explode').addEventListener('click', function () { setExploded(true); });
  document.getElementById('h-boost').addEventListener('click', function () { setFlat(false); });
  document.getElementById('h-flat').addEventListener('click', function () { setFlat(true); });

  // ---------- product: gentle float; double-click (or double-tap) to take it apart ----------
  var lastTap = 0;
  hero.addEventListener('dblclick', function (e) { e.stopPropagation(); setExploded(true); });
  hero.addEventListener('pointerup', function (e) {
    if (e.pointerType === 'mouse') return;
    e.stopPropagation(); var now = Date.now(); if (now - lastTap < 320) { setExploded(true); lastTap = 0; } else lastTap = now;
  });
  stage.addEventListener('dblclick', function (e) { if (exploded && !e.target.closest('.pin')) setExploded(false); });
  // double tap on touch, exploded view → assemble
  var lastStageTap = 0;
  stage.addEventListener('pointerup', function (e) {
    if (!exploded || e.pointerType === 'mouse' || e.target.closest('.pin')) return;
    var now = Date.now(); if (now - lastStageTap < 320) { setExploded(false); lastStageTap = 0; } else lastStageTap = now;
  });

  idleCard();
  updateTag();

  function report() { try { parent.postMessage({ airevoHeight: document.documentElement.scrollHeight }, '*'); } catch (e) {} }
  report(); window.addEventListener('resize', report); new MutationObserver(report).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'hidden'] });
})();
</script>
</body>
</html>
